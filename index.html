<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>とけいのまちの じかんたんてい</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    /* 全体のスタイル・背景の朝昼夜 */
    body { margin: 0; overflow-x: hidden; touch-action: manipulation; user-select: none; }
    .app-container {
      text-align: center; font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      min-height: 100vh; padding: clamp(14px, 2.4vw, 30px); color: #333; transition: background 1s ease;
    }
    .bg-morning { background: linear-gradient(to bottom, #8ee4af, #edf5e1); }
    .bg-day { background: linear-gradient(to bottom, #74b9ff, #dfe6e9); }
    .bg-sunset { background: linear-gradient(to bottom, #ff9ff3, #feca57); }
    .bg-night { background: linear-gradient(to bottom, #2c3e50, #34495e); color: white; }
    
    h1 { color: #fff; text-shadow: 0 4px 6px rgba(0,0,0,0.2), 0 0 10px #ff9f43; font-size: 28px; margin-top: 10px; }
    .status-bar {
      background: rgba(255,255,255,0.9); padding: 8px 15px; border-radius: 20px; color: #333;
      display: inline-flex; align-items: center; gap: 15px; font-size: 20px; font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px;
    }
    .combo-text { color: #ff4757; animation: bounce 0.5s infinite alternate; }

    /* ホーム画面のオシャレなボタン群 */
    .home-shell { max-width: 1180px; margin: 0 auto; }
    .home-intro { position: relative; max-width: 760px; margin: 0 auto 18px; }
    .home-intro h1 { margin-bottom: 4px; }
    .home-intro p { margin: 0; color: rgba(255,255,255,.92); font-weight: bold; font-size: clamp(14px, 1.8vw, 19px); }
    .home-nav { position: absolute; right: clamp(0px, 2vw, 28px); bottom: -5px; width: 92px; height: 118px; object-fit: contain; object-position: bottom; pointer-events: none; filter: drop-shadow(0 4px 3px rgba(0,0,0,.18)); }
    .menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 760px; margin: 0 auto; }
    .menu-btn {
      border: none; border-radius: 15px; padding: 15px 5px; font-size: 16px; font-weight: bold;
      color: white; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,0.2); transition: transform 0.1s;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    }
    .menu-btn:active { transform: translateY(6px); box-shadow: none; }
    .btn-easy { background: #78e08f; }
    .btn-read1 { background: #38ada9; }
    .btn-set { background: #55efc4; color: #2d3436; }
    .btn-read2 { background: #0a3d62; }
    .btn-move1 { background: #82ccdd; }
    .btn-move2 { background: #60a3bc; }
    .btn-ta-read { background: #e55039; grid-column: span 2; font-size: 18px; }
    .btn-ta-move { background: #9b59b6; grid-column: span 2; font-size: 18px; }
    .btn-teacher { background: #9b59b6; grid-column: span 2; font-size: 18px; padding: 15px; }
    .btn-book { background: #f6b93b; font-size: 18px; color: #333; }
    .btn-record { background: #f39c12; font-size: 18px; color: #fff; }
    .btn-reset { background: #7f8c8d; grid-column: span 2; padding: 10px; font-size: 14px; margin-top: 20px;}
    .navi-feedback { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 52px; margin: 0 auto 8px; color: #2d3436; font-weight: bold; font-size: 17px; }
    .navi-feedback img { width: 52px; height: 52px; object-fit: contain; }
    
    /* 時計周り */
    .clock-container {
      margin: 10px auto; width: min(280px, 76vw); height: min(280px, 76vw); background: white;
      border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.2); position: relative;
    }
    .clock-hand { transition: transform 0.1s linear; }
    .clock-hint { fill: #2477c9; font-size: 6px; font-weight: bold; }
    .clock-guide { background: #eaf5ff; color: #244f78; border: 2px solid #8fc6ef; padding: 10px; border-radius: 12px; font-size: 16px; font-weight: bold; max-width: 500px; margin: 0 auto 10px; line-height: 1.5; }
    .clock-guide .hour-word { color: #e95362; }
    .clock-guide .minute-word { color: #2477c9; }

    /* UIパーツ */
    .message-box {
      background: rgba(255,255,255,0.85); color: #2d3436; padding: 10px; border-radius: 10px;
      font-size: 18px; font-weight: bold; min-height: 28px; margin-bottom: 10px; max-width: 400px; margin-left: auto; margin-right: auto;
    }
    .ta-question { background: #ffeaa7; color: #d63031; border: 3px solid #fdcb6e; font-size: 22px; padding: 15px; }
    .btn-back { background: #ff7f50; color: white; border: none; padding: 10px 30px; border-radius: 20px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 0 #cd6133; margin-top: 20px; cursor: pointer;}
    .btn-back:active { transform: translateY(4px); box-shadow: none; }

    /* 選択肢・コントロール */
    .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .choice-btn { background: #fff; border: 3px solid #4ecdc4; font-size: 20px; font-weight: bold; padding: 10px 15px; border-radius: 15px; cursor: pointer; width: 130px; box-shadow: 0 4px 0 #4ecdc4; }
    .choice-btn:active { transform: translateY(4px); box-shadow: none; }
    .controls { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
    .control-btn { background: #ffeaa7; border: 2px solid #fdcb6e; color: #d63031; font-size: 16px; font-weight: bold; padding: 8px 10px; border-radius: 10px; cursor: pointer; box-shadow: 0 3px 0 #fdcb6e; }
    .control-btn:active { transform: translateY(3px); box-shadow: none; }
    .btn-hint { background: #ffeaa7; border: none; border-radius: 15px; padding: 5px 15px; font-weight: bold; box-shadow: 0 3px 0 #fdcb6e; margin-bottom: 10px; cursor: pointer; }

    /* フリーモード用 */
    .teacher-panel { background: #f8c291; padding: 20px; border-radius: 15px; border: 4px solid #e55039; max-width: 500px; margin: 0 auto; }
    .teacher-title { color: #c0392b; font-size: 24px; font-weight: bold; margin-bottom: 15px; text-shadow: 1px 1px 0 #fff; }
    .teacher-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .teacher-btn { background: #fad390; border: 2px solid #e58e26; border-radius: 10px; padding: 10px; font-size: 18px; font-weight: bold; color: #b71540; cursor: pointer; box-shadow: 0 4px 0 #e58e26; }
    .teacher-btn:active { transform: translateY(4px); box-shadow: none; }
    .teacher-input { width: 100%; padding: 10px; font-size: 18px; border-radius: 8px; border: 2px solid #e58e26; margin-bottom: 10px; text-align: center; box-sizing: border-box; }

    /* テンキー */
    .numpad-container { max-width: 300px; margin: 0 auto; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 15px; }
    .input-display { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; font-size: 24px; font-weight: bold; color: #333; }
    .input-box { width: 60px; height: 40px; border: 3px solid #ccc; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: white; cursor: pointer; }
    .input-box.active { border-color: #ff4757; background: #ffeaa7; }
    .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .num-key { background: #dfe6e9; border: none; border-radius: 10px; padding: 10px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #b2bec3; }
    .num-key:active { transform: translateY(4px); box-shadow: none; }
    .num-key.action { background: #74b9ff; color: white; box-shadow: 0 4px 0 #0984e3; }
    .num-key.submit { background: #00b894; color: white; box-shadow: 0 4px 0 #00b894; grid-column: span 3; }
    .solve-layout { max-width: 1120px; margin: 0 auto; }
    .solve-clock, .solve-panel { min-width: 0; }
    .solve-panel { display: flex; flex-direction: column; align-items: stretch; }
    .solve-panel .message-box, .solve-panel .clock-guide { width: 100%; max-width: none; }

    /* バッジ手帳 */
    .notebook { background: linear-gradient(145deg, #fffdf0, #fff4c2); border: 5px solid #ffcc80; border-radius: 18px; padding: 15px; max-width: 620px; margin: 0 auto; min-height: 200px; }
    .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; margin-top: 15px; }
    .sticker-card { min-width: 0; text-align: center; }
    .sticker { font-size: 28px; background: white; border-radius: 14px; width: 70px; height: 70px; margin: 0 auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); overflow: hidden; }
    .sticker img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .sticker.N { border: 3px solid #b7c4d1; }
    .sticker.R { border: 3px solid #a8b4c2; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); box-shadow: 0 0 10px silver; }
    .sticker.SR { border: 3px solid #ffd700; background: linear-gradient(135deg, #fff9c4, #ffc107); box-shadow: 0 0 15px gold; }
    .sticker.SECRET { border: 3px solid #e056fd; background: linear-gradient(135deg, #dff9fb, #c7ceff); box-shadow: 0 0 18px #e056fd; }
    .badge-name { color: #5b4636; font-size: 10px; font-weight: bold; line-height: 1.2; margin-top: 4px; overflow-wrap: anywhere; }
    .rarity-label { font-size: 9px; font-weight: bold; color: #777; }
    .locked-sticker { background: rgba(0,0,0,0.08); font-size: 25px; color: rgba(0,0,0,0.25); border: 2px dashed #c9bda8; }

    /* ド派手演出 */
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .success-burst { position: relative; width: min(430px, 92vw); height: min(430px, 92vw); display: flex; align-items: center; justify-content: center; }
    .success-card { position: relative; z-index: 2; background: #fffdf1; border: 8px solid #ffd447; border-radius: 50%; width: 250px; height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 0 10px #ff8d73, 0 12px 0 rgba(119,56,35,.25); animation: success-pop .7s cubic-bezier(.18,.9,.27,1.35) forwards; }
    .hanamaru { font-size: 115px; line-height: .9; text-shadow: 0 0 20px #ffcc80; }
    .success-text { color: #ef4d58; font-size: 34px; font-weight: 900; text-shadow: 2px 2px 0 #fff, 0 3px 0 #ffcf4d; letter-spacing: .06em; }
    .success-sub { color: #6a4d2e; font-size: 17px; font-weight: bold; margin-top: 5px; }
    .confetti { position: absolute; left: 50%; top: 50%; width: 16px; height: 26px; border-radius: 4px; background: var(--c); transform: rotate(var(--r)) translateY(-155px); animation: confetti-pop .8s ease-out forwards; animation-delay: var(--d); }
    @keyframes stamp { 0% { transform: scale(5) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
    @keyframes bounce { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    @keyframes success-pop { 0% { transform: scale(.1) rotate(-18deg); opacity: 0; } 65% { transform: scale(1.08) rotate(4deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes confetti-pop { 0% { opacity: 0; } 22% { opacity: 1; } 100% { opacity: 0; transform: rotate(calc(var(--r) + 130deg)) translateY(-210px); } }
    
    .gacha-bg { background: rgba(0,0,0,0.8); pointer-events: auto; flex-direction: column; }
    .gacha-item { animation: stamp 0.8s ease-out forwards; position: relative; width: 150px; height: 150px; }
    .gacha-item img { width: 100%; height: 100%; object-fit: contain; }
    .gacha-item.R::after { content: '✨'; position: absolute; font-size: 60px; top: -20px; right: -20px; animation: spin 3s linear infinite; }
    .gacha-item.SR::after { content: '🌟'; position: absolute; font-size: 80px; top: -30px; right: -30px; animation: spin 2s linear infinite; }
    .gacha-item.SECRET::after { content: '💎'; position: absolute; font-size: 72px; top: -25px; right: -25px; animation: spin 1.6s linear infinite; }
    .gacha-title { color: white; font-size: 30px; margin-bottom: 20px; font-weight: bold; text-shadow: 0 0 10px gold; animation: bounce 0.5s infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* たんていの きろく (レコード画面) */
    .detective-container {
      max-width: 500px; margin: 0 auto; text-align: left;
      background: #fff9c4; border: 4px solid #f39c12; border-radius: 15px;
      padding: 15px; min-height: 80vh; color: #2d3436;
      box-shadow: inset 0 0 20px rgba(243, 156, 18, 0.2), 0 8px 0 #e67e22;
    }
    .detective-header { text-align: center; border-bottom: 3px dashed #e1b12c; padding-bottom: 15px; margin-bottom: 20px; }
    .detective-title { font-size: 24px; font-weight: bold; color: #d35400; margin: 0; text-shadow: 1px 1px 0 #fff; }

    .status-badge { background: white; border: 3px solid #f1c40f; border-radius: 15px; padding: 15px; display: flex; gap: 15px; margin-bottom: 25px; box-shadow: 0 4px 0 #f39c12; }
    .badge-item { flex: 1; text-align: center; }
    .badge-label { font-size: 14px; font-weight: bold; color: #7f8c8d; margin-bottom: 5px; }
    .badge-value { font-size: 28px; font-weight: bold; }
    .value-rank { color: #e74c3c; }
    .value-gear { color: #f39c12; }

    .quest-title { font-size: 18px; font-weight: bold; color: #d35400; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
    .quest-list { background: rgba(255,255,255,0.7); border-radius: 10px; border: 2px solid #f6e58d; margin-bottom: 25px; }
    .quest-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 2px dashed #f6e58d; }
    .quest-item:last-child { border-bottom: none; }
    .quest-info { display: flex; flex-direction: column; gap: 2px; flex: 1; padding-right: 10px; }
    .quest-name { font-size: 16px; font-weight: bold; color: #2d3436; line-height: 1.3; word-break: break-word; }
    .quest-meta { font-size: 12px; color: #7f8c8d; font-weight: bold; }
    
    .stamp { font-size: 14px; font-weight: bold; padding: 5px 10px; border-radius: 8px; transform: rotate(-5deg); white-space: nowrap; }
    .stamp-clear { border: 2px solid #2ecc71; color: #2ecc71; }
    .stamp-try { border: 2px solid #e74c3c; color: #e74c3c; background: #fad390; }
    .empty-quest { text-align: center; padding: 30px 10px; background: white; border-radius: 10px; border: 2px dashed #d1ccc0; color: #84817a; font-weight: bold; margin-bottom: 25px; }

    .btn-close-record { width: 100%; background: #7bed9f; color: #2f3542; border: none; padding: 12px; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #2ed573; }
    .btn-close-record:active { transform: translateY(4px); box-shadow: none; }

    @media (min-width: 768px) {
      .home-shell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); column-gap: clamp(24px, 5vw, 72px); align-items: center; min-height: calc(100vh - 145px); }
      .home-intro { max-width: 460px; margin: 0; }
      .home-intro h1 { font-size: clamp(34px, 4vw, 52px); }
      .home-nav { width: 112px; height: 145px; right: 0; }
      .menu-grid { max-width: none; gap: 15px; }
      .menu-btn { font-size: 18px; padding: 20px 10px; min-height: 78px; }
      .btn-ta-read, .btn-ta-move { font-size: 20px; }
      .clock-container { width: 300px; height: 300px; margin: 20px auto; }
      h1 { font-size: 34px; margin-bottom: 20px; }
      .message-box { font-size: 22px; max-width: 500px; padding: 15px; }
      .numpad-container { max-width: 350px; }
      .num-key { font-size: 24px; padding: 15px; }
    }
    @media (min-width: 768px) {
      .solve-layout { display: grid; grid-template-columns: minmax(330px, 0.9fr) minmax(390px, 1.1fr); gap: clamp(24px, 5vw, 70px); align-items: start; text-align: left; }
      .solve-clock { display: flex; justify-content: center; padding-top: 18px; }
      .solve-panel .message-box, .solve-panel .navi-feedback, .solve-panel .clock-guide, .solve-panel .btn-hint, .solve-panel .choices, .solve-panel .numpad-container { margin-left: 0; margin-right: 0; }
      .solve-panel .navi-feedback { justify-content: flex-start; }
      .solve-panel .choices { justify-content: flex-start; }
      .solve-panel .numpad-container { max-width: none; padding: 12px; }
      .solve-panel .numpad-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; }
      .solve-panel .num-key { font-size: 21px; padding: 9px 5px; min-height: 46px; }
      .solve-panel .num-key.submit { grid-column: span 6; }
      .solve-panel .btn-back { align-self: flex-start; }
    }
    @media (min-width: 768px) and (max-height: 800px) {
      .solve-clock { padding-top: 0; }
      .solve-panel .message-box { padding: 10px; margin-bottom: 7px; }
      .solve-panel .navi-feedback { min-height: 44px; margin-bottom: 4px; }
      .solve-panel .navi-feedback img { width: 44px; height: 44px; }
      .solve-panel .clock-guide { padding: 7px; font-size: 15px; margin-bottom: 6px; }
      .solve-panel .numpad-container { padding: 9px; }
      .solve-panel .num-key { min-height: 40px; padding: 5px; }
    }
    @media (max-width: 767px) { .solve-layout { display: block; } }
    @media (min-width: 1100px) {
      .menu-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .btn-ta-read, .btn-ta-move, .btn-teacher, .btn-reset { grid-column: span 3; }
    }
    @media (max-width: 767px) { .home-nav { display: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const ASSET_BASE = 'https://tt-sensei.github.io/edu-assets/';
    const NAVI_BASE = 'https://tt-sensei.github.io/navi-character-/assets/web/characters/';
    const naviImage = (character, pose) => `${NAVI_BASE}${character}/fullbody/${pose}.webp`;
    const naviPool = ['riku', 'sora', 'kai', 'saku', 'tsuki', 'nami'];
    const randomNavi = () => naviPool[Math.floor(Math.random() * naviPool.length)];
    const collectionLabels = {
      animal: 'どうぶつ', dinosaur: 'きょうりゅう', fantasy: 'ファンタジー',
      flower: 'おはな', fruit: 'くだもの', gem: 'ほうせき', insect: 'こんちゅう',
      music: 'おんがく', 'sea-animal': 'うみのなかま', treasure: 'たからもの'
    };
    const rarityClass = rarity => rarity === 'super-rare' ? 'SR' : rarity === 'secret' ? 'SECRET' : rarity === 'rare' ? 'R' : 'N';
    const makeCollectionBadge = (collection, rarity, slug) => ({
      id: `${collection}-${rarity}-${slug}`,
      name: `${collectionLabels[collection]}・${slug.replaceAll('-', ' ')}`,
      rarity: rarityClass(rarity),
      rarityName: rarity === 'super-rare' ? 'SUPER RARE' : rarity === 'secret' ? 'SECRET' : rarity === 'rare' ? 'RARE' : 'COMMON',
      image: `${ASSET_BASE}assets/web/collections/${collection}/${rarity}/${slug}/badge.webp`
    });
    const collectionSets = {
      animal: ['bear','cat','fox','hamster','panda','penguin','rabbit','shiba'],
      dinosaur: ['ankylosaurus','brachiosaurus','parasaurolophus','pteranodon','spinosaurus','stegosaurus','triceratops','tyrannosaurus'],
      fantasy: ['dragon','fairy','golem','griffin','phoenix','slime','unicorn','wizard-cat'],
      flower: ['cherry-blossom','clover-flower','daisy','dandelion','hydrangea','morning-glory','sunflower','tulip'],
      fruit: ['apple','banana','grape','orange','peach','pineapple','strawberry','watermelon']
    };
    const fullCollectionBadges = Object.entries(collectionSets).flatMap(([collection, commons]) => [
      ...commons.map(slug => makeCollectionBadge(collection, 'common', slug)),
      ...({
        animal: ['hedgehog','koala','otter','squirrel'], dinosaur: ['dimetrodon','elasmosaurus','pachycephalosaurus','velociraptor'],
        fantasy: ['kitsune-spirit','mermaid','pegasus','treasure-mimic'], flower: ['camellia','lavender','lily','rose'],
        fruit: ['blueberry','cherry','mango','melon']
      }[collection] || []).map(slug => makeCollectionBadge(collection, 'rare', slug)),
      ...({
        animal: ['lion','white-tiger'], dinosaur: ['king-t-rex','mosasaurus'], fantasy: ['celestial-dragon','moon-unicorn'],
        flower: ['blue-rose','lotus'], fruit: ['dragon-fruit','star-fruit']
      }[collection] || []).map(slug => makeCollectionBadge(collection, 'super-rare', slug)),
      ...({
        animal: ['unicorn-puppy'], dinosaur: ['cosmic-dino'], fantasy: ['ancient-guardian'],
        flower: ['rainbow-flower'], fruit: ['rainbow-fruit']
      }[collection] || []).map(slug => makeCollectionBadge(collection, 'secret', slug))
    ]);
    const extraCommon = {
      gem: ['amethyst','aquamarine','citrine','emerald','garnet'],
      insect: ['ant','bee','beetle','butterfly','dragonfly'],
      music: ['drum','guitar-pick','maracas','microphone','music-note'],
      'sea-animal': ['clownfish','crab','dolphin','jellyfish','octopus'],
      treasure: ['coin-pouch','compass','gem-shard','gold-coin','golden-lock']
    };
    const ALL_BADGES = [...fullCollectionBadges, ...Object.entries(extraCommon).flatMap(([collection, slugs]) => slugs.map(slug => makeCollectionBadge(collection, 'common', slug)))];

    const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    const playTone = (freq, type, duration, startTimeOffset, vol=0.1) => {
      if (!AudioContextCtor) return;
      try {
        if (!audioCtx) audioCtx = new AudioContextCtor();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) { return; }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTimeOffset);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime + startTimeOffset);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTimeOffset + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + startTimeOffset); osc.stop(audioCtx.currentTime + startTimeOffset + duration);
    };

    const sounds = {
      click: () => playTone(800, 'sine', 0.05, 0),
      tick: () => playTone(1200, 'square', 0.02, 0, 0.05),
      correct: () => { playTone(523.25, 'sine', 0.1, 0); playTone(659.25, 'sine', 0.1, 0.1); playTone(783.99, 'sine', 0.3, 0.2); },
      wrong: () => { playTone(150, 'sawtooth', 0.3, 0); playTone(150, 'sawtooth', 0.3, 0.4); },
      gachaN: () => { playTone(440, 'square', 0.1, 0); playTone(554.37, 'square', 0.1, 0.1); playTone(659.25, 'square', 0.3, 0.2); },
      gachaSR: () => { 
        [523, 587, 659, 698, 783, 880, 987, 1046].forEach((f, i) => playTone(f, 'sine', 0.1, i*0.05));
        playTone(1046, 'square', 0.5, 0.4); 
      },
      timeAttack: () => playTone(880, 'sine', 0.1, 0)
    };

    const calcTime = (totalMinutes) => {
      while (totalMinutes < 0) totalMinutes += 24 * 60;
      const h24 = Math.floor(totalMinutes / 60) % 24;
      const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
      const m = Math.round(totalMinutes % 60); 
      return { h12, h24, m };
    };

    const getBgClass = (totalMinutes) => {
      const { h24 } = calcTime(totalMinutes);
      if (h24 >= 5 && h24 < 9) return 'bg-morning';
      if (h24 >= 9 && h24 < 16) return 'bg-day';
      if (h24 >= 16 && h24 < 19) return 'bg-sunset';
      return 'bg-night';
    };

    const Clock = ({ totalMinutes, showHint, onDrag, interactive, step = 5 }) => {
      const svgRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);

      const updateDrag = useCallback((e) => {
        if (!svgRef.current || !onDrag) return;
        const rect = svgRef.current.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const dx = clientX - cx;
        const dy = clientY - cy;
        const angle = Math.atan2(dy, dx);
        const degrees = angle * (180 / Math.PI);
        const normalized = (degrees + 360 + 90) % 360;
        
        let newMinutes = Math.round((normalized / 6) / step) * step;
        if (newMinutes === 60) newMinutes = 0;

        const currentM = Math.round(totalMinutes) % 60;
        let delta = newMinutes - currentM;
        if (delta > 30) delta -= 60;
        if (delta < -30) delta += 60;
        
        if (delta !== 0) {
          sounds.tick();
          onDrag(totalMinutes + delta);
        }
      }, [totalMinutes, onDrag, step]);

      const handlePointerDown = (e) => {
        if (!interactive) return;
        setIsDragging(true); updateDrag(e);
      };

      useEffect(() => {
        const handleMove = (e) => { if (isDragging) updateDrag(e); };
        const handleUp = () => setIsDragging(false);
        
        if (isDragging) {
          window.addEventListener('mousemove', handleMove, {passive: false});
          window.addEventListener('touchmove', handleMove, {passive: false});
          window.addEventListener('mouseup', handleUp);
          window.addEventListener('touchend', handleUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('touchmove', handleMove);
          window.removeEventListener('mouseup', handleUp);
          window.removeEventListener('touchend', handleUp);
        };
      }, [isDragging, updateDrag]);

      const hourAngle = totalMinutes * 0.5;
      const minuteAngle = totalMinutes * 6;

      return (
        <div className="clock-container">
          <svg viewBox="0 0 100 100" width="100%" height="100%" ref={svgRef} 
               onMouseDown={handlePointerDown} onTouchStart={handlePointerDown} 
               style={{touchAction: 'none', cursor: interactive ? 'pointer' : 'default'}}>
            <circle cx="50" cy="50" r="48" fill="white" stroke="#ffb8b8" strokeWidth="4" />
            {[...Array(12)].map((_, i) => {
              const num = i + 1; const angle = (num * 30 - 90) * (Math.PI / 180);
              return <text key={num} x={50 + 32 * Math.cos(angle)} y={50 + 32 * Math.sin(angle)} fontSize="10" fill="#ff6b6b" fontWeight="bold" textAnchor="middle" dominantBaseline="central">{num}</text>;
            })}
            {showHint && [...Array(12)].map((_, i) => {
              const num = i === 0 ? 60 : i * 5; const angle = (i * 30 - 90) * (Math.PI / 180);
              return <text key={`h-${num}`} x={50 + 44 * Math.cos(angle)} y={50 + 44 * Math.sin(angle)} className="clock-hint" textAnchor="middle" dominantBaseline="central">{num}</text>;
            })}
            {[...Array(60)].map((_, i) => {
              if (i % 5 === 0) return null;
              const angle = (i * 6 - 90) * (Math.PI / 180);
              return <circle key={`dot-${i}`} cx={50 + 42 * Math.cos(angle)} cy={50 + 42 * Math.sin(angle)} r="0.5" fill="#a0d2eb" />;
            })}
            <line className="clock-hand" x1="50" y1="50" x2="50" y2="28" stroke="#ff6b6b" strokeWidth="4" strokeLinecap="round" transform={`rotate(${hourAngle} 50 50)`} />
            <line className="clock-hand" x1="50" y1="50" x2="50" y2="16" stroke="#2477c9" strokeWidth="3" strokeLinecap="round" transform={`rotate(${minuteAngle} 50 50)`} />
            <circle cx="50" cy="50" r="6" fill="#2477c9" />
            <circle cx="50" cy="50" r="3" fill="#333" />
          </svg>
        </div>
      );
    };

    const Numpad = ({ onSubmit }) => {
      const [activeField, setActiveField] = useState('H');
      const [h, setH] = useState('');
      const [m, setM] = useState('');

      const handleKey = (key) => {
        sounds.tick();
        if (key === 'C') {
          if (activeField === 'H') setH(''); else setM('');
          return;
        }
        
        if (activeField === 'H') {
          const newVal = h + String(key);
          if (parseInt(newVal) <= 12) {
            setH(newVal);
            if (newVal.length === 2 || (newVal.length === 1 && parseInt(newVal) >= 2)) {
              setActiveField('M');
            }
          }
        } else {
          const newVal = m + String(key);
          if (newVal.length <= 2 && parseInt(newVal) <= 59) {
            setM(newVal);
          }
        }
      };

      return (
        <div className="numpad-container">
          <div className="input-display">
            <div className={`input-box ${activeField === 'H' ? 'active' : ''}`} onClick={() => setActiveField('H')}>{h}</div> じ
            <div className={`input-box ${activeField === 'M' ? 'active' : ''}`} onClick={() => setActiveField('M')}>{m}</div> ふん
          </div>
          <div className="numpad-grid">
            {[1,2,3,4,5,6,7,8,9].map(n => <button key={n} className="num-key" onClick={() => handleKey(n)}>{n}</button>)}
            <button className="num-key action" onClick={() => handleKey('C')}>C</button>
            <button className="num-key" onClick={() => handleKey(0)}>0</button>
            <button className="num-key action" onClick={() => setActiveField(activeField === 'H'?'M':'H')}>→</button>
            <button className="num-key submit" onClick={() => onSubmit(parseInt(h||0), parseInt(m||0))}>これだ！</button>
          </div>
        </div>
      );
    };

    const DetectiveRecord = ({ onBack, totalGears, questData }) => {
      const getRank = (gears) => {
        if (gears >= 200) return "マスターたんてい";
        if (gears >= 100) return "ベテランたんてい";
        if (gears >= 30) return "ひとりだち";
        return "みならい";
      };

      return (
        <div className="detective-container">
          <div className="detective-header">
            <h2 className="detective-title">🔍 たんていの きろく</h2>
          </div>

          <div className="status-badge">
            <div className="badge-item">
              <div className="badge-label">いまの ランク</div>
              <div className="badge-value value-rank">{getRank(totalGears)}</div>
            </div>
            <div className="badge-item">
              <div className="badge-label">あつめた ギア</div>
              <div className="badge-value value-gear">⚙️ {totalGears}</div>
            </div>
          </div>

          <div className="quest-title">📜 さいきんの クエスト</div>
          
          {questData.length === 0 ? (
            <div className="empty-quest">
              <div style={{fontSize: '40px', marginBottom: '10px'}}>🕵️‍♂️</div>
              まだ クエストの きろくがないよ。<br/>「やさしい」から ちょうせんしてみよう！
            </div>
          ) : (
            <div className="quest-list">
              {questData.map((item) => (
                <div className="quest-item" key={item.id}>
                  <div className="quest-info">
                    <div className="quest-name">{item.name}</div>
                    <div className="quest-meta">{item.time} • {item.attempts}かい ちょうせん</div>
                  </div>
                  {item.misses === 0 ? (
                    <div className="stamp stamp-clear">💮クリア!</div>
                  ) : (
                    <div className="stamp stamp-try">🔥もうとっくん</div>
                  )}
                </div>
              ))}
            </div>
          )}

          <div style={{marginTop: '20px'}}>
            <button className="btn-close-record" onClick={onBack}>ホームへ もどる</button>
          </div>
        </div>
      );
    };

    const getSafeGears = () => { try { return parseInt(localStorage.getItem('gears')) || 0; } catch (e) { return 0; } };
    const getSafeBadges = () => { try { const s = localStorage.getItem('unlockedBadges'); return s ? JSON.parse(s) : []; } catch (e) { return []; } };
    const getSafeHistory = () => { try { const h = localStorage.getItem('playHistory'); return h ? JSON.parse(h) : []; } catch (e) { return []; } };

    function App() {
      const [view, setView] = useState('home');
      const [bgMode, setBgMode] = useState('bg-day');
      
      const [gears, setGears] = useState(getSafeGears);
      const [unlockedBadges, setUnlockedBadges] = useState(getSafeBadges);
      const [playHistory, setPlayHistory] = useState(getSafeHistory);
      
      const [combo, setCombo] = useState(0);
      const [mistakes, setMistakes] = useState(0);
      
      const [modeParams, setModeParams] = useState(null);
      const [question, setQuestion] = useState(null);
      const [questionCount, setQuestionCount] = useState(1); // クエストの進行度(5問まで)
      const MAX_QUESTIONS = 5;

      const [message, setMessage] = useState('');
      const [showSuccess, setShowSuccess] = useState(false);
      const [showHint, setShowHint] = useState(false);
      const [interactiveMins, setInteractiveMins] = useState(0);
      const [gachaResult, setGachaResult] = useState(null);
      const [naviCharacter, setNaviCharacter] = useState(randomNavi());
      const [feedback, setFeedback] = useState('');
      
      const [timeLeft, setTimeLeft] = useState(0);
      const [score, setScore] = useState(0);
      const timerRef = useRef(null);
      
      const sessionRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('gears', gears);
          localStorage.setItem('unlockedBadges', JSON.stringify(unlockedBadges));
          localStorage.setItem('playHistory', JSON.stringify(playHistory));
        } catch (e) {}
      }, [gears, unlockedBadges, playHistory]);

      useEffect(() => {
        if (view === 'home' || view === 'notebook' || view === 'record' || view === 'freemode') setBgMode('bg-day');
        else if (question) setBgMode(getBgClass(question.displayMinutes));
      }, [view, question]);

      const getModeName = (type, lv) => {
        if(type === 'read' && lv === 0) return '🐣 やさしい';
        if(type === 'read' && lv === 1) return '🥉 よむ Lv1';
        if(type === 'set' && lv === 1) return '⌚️ あわせる';
        if(type === 'read' && lv === 2) return '🥈 よむ Lv2';
        if(type === 'move' && lv === 1) return '🥇 まえ・あと Lv1';
        if(type === 'move' && lv === 2) return '🏆 まえ・あと Lv2';
        return 'クエスト';
      };

      const saveSessionAndGoHome = () => {
        if (sessionRef.current && sessionRef.current.attempts > 0) {
          const newEntry = {
            id: Date.now(),
            name: sessionRef.current.name,
            attempts: sessionRef.current.attempts,
            misses: sessionRef.current.misses,
            time: "きょう"
          };
          setPlayHistory(prev => [newEntry, ...prev].slice(0, 8));
        }
        sessionRef.current = null;
        setView('home');
      };

      const triggerSuccess = () => {
        sounds.correct();
        setNaviCharacter(randomNavi());
        setFeedback('せいかい！そのちょうし！');
        setShowSuccess(true);
        setTimeout(() => setShowSuccess(false), 1200);
      };

      const addReward = (amount) => {
        let earned = amount || 1;
        const newCombo = combo + 1;
        setCombo(newCombo);
        
        if (sessionRef.current) sessionRef.current.attempts += 1;

        if (newCombo > 0 && newCombo % 3 === 0) {
          earned += 1;
          setMessage(`大せいかい！🔥3コンボボーナス！ (+${earned}⚙️)`);
        } else {
          setMessage(`大せいかい！ (+${earned}⚙️)`);
        }
        setGears(g => g + earned);
        triggerSuccess();
      };

      const handleCorrectQuest = () => {
        addReward(modeParams.reward);
        setMistakes(0);
        
        if (questionCount >= MAX_QUESTIONS) {
          setTimeout(() => {
            sounds.gachaSR();
            setMessage('🎉 クエスト クリア！！ 🎉 ホームにもどるよ！');
            setTimeout(() => {
              saveSessionAndGoHome();
            }, 3000);
          }, 1200);
        } else {
          setQuestionCount(c => c + 1);
          setTimeout(() => generateQuestion(modeParams), 1500);
        }
      };

      const handleMistake = () => {
        sounds.wrong();
        setNaviCharacter(randomNavi());
        setFeedback('だいじょうぶ。もういちど！');
        setCombo(0);
        const newMistakes = mistakes + 1;
        
        if (sessionRef.current) {
          sessionRef.current.misses += 1;
          sessionRef.current.attempts += 1;
        }

        if (newMistakes >= 3 && view !== 'time-attack') {
          setMistakes(0);
          setShowHint(true);
          setMessage('いっしょに たしかめよう！ みじかい はりを見てから、ながい はりを 5とびで数えよう。');
        } else {
          setMistakes(newMistakes);
          setMessage(`${question.text} ❌ざんねん!(${newMistakes}ミス)`);
        }
      };

      const generateQuestion = (params) => {
        if (!params) return;
        setShowHint(false);
        const { type, lv } = params;
        let q = { displayMinutes: 0, id: Math.random(), text: '' };
        const h = Math.floor(Math.random() * 12) + 1;

        if (type === 'read') {
          let m = 0;
          if (lv === 0) m = Math.random() < 0.5 ? 0 : 30;
          else m = Math.floor(Math.random() * 12) * 5;
          const totalM = h * 60 + m;
          q.displayMinutes = totalM; q.correctH = calcTime(totalM).h12; q.correctM = calcTime(totalM).m;
          
          if (lv === 0 || lv === 1) {
            const wrong1 = calcTime(totalM + (lv===0?30:15));
            const wrong2 = calcTime(totalM + 60);
            q.choices = [ { h: q.correctH, m: q.correctM }, { h: wrong1.h12, m: wrong1.m }, { h: wrong2.h12, m: q.correctM } ].sort(() => Math.random() - 0.5);
          }
          q.text = lv === 0 ? 'なんじ なんぷん？(やさしい)' : 'なんじ なんぷん かな？';
          setMessage(q.text);
        } 
        else if (type === 'set') {
          const targetH = Math.floor(Math.random() * 12) + 1;
          const targetM = Math.floor(Math.random() * 12) * 5;
          const targetTotal = targetH * 60 + targetM;
          let startTotal;
          do { startTotal = (Math.floor(Math.random() * 12) + 1) * 60 + Math.floor(Math.random() * 12) * 5; } while (startTotal === targetTotal);
          q.targetTotal = targetTotal; q.displayMinutes = startTotal; setInteractiveMins(startTotal);
          const st = calcTime(targetTotal);
          q.text = `「${st.h12}じ ${st.m}ふん」に あわせてね！`; setMessage(q.text);
        }
        else if (type === 'move') {
          const startTotal = h * 60 + (Math.floor(Math.random() * 4) * 15);
          const offsets = [10, 15, 20, 30, 60, -10, -15, -20, -30, -60];
          const offset = offsets[Math.floor(Math.random() * offsets.length)];
          q.displayMinutes = startTotal; q.offset = offset; q.targetTotal = startTotal + offset;
          q.correctH = calcTime(q.targetTotal).h12; q.correctM = calcTime(q.targetTotal).m;
          setInteractiveMins(startTotal);
          const st = calcTime(startTotal);
          let text = offset > 0 ? `${offset}ぷん あと` : `${Math.abs(offset)}ぷん まえ`;
          if(offset === 60) text = "1じかん あと"; if(offset === -60) text = "1じかん まえ";
          q.text = `いま ${st.h12}じ${st.m}ふん。「${text}」は なんじ？`; setMessage(q.text);
        }
        setQuestion(q);
      };

      const startGame = (type, lv, reward) => {
        sounds.click();
        const params = { type, lv, reward };
        setModeParams(params); setMistakes(0); setCombo(0); setQuestionCount(1);
        sessionRef.current = { name: getModeName(type, lv), attempts: 0, misses: 0 };
        generateQuestion(params);
        setView('game');
      };

      const checkReadLv1 = (ansH, ansM) => {
        if (!question || questionCount > MAX_QUESTIONS) return;
        if (ansH === question.correctH && ansM === question.correctM) handleCorrectQuest(); 
        else handleMistake();
      };
      const checkNumpad = (h, m) => {
        if (!question || questionCount > MAX_QUESTIONS) return;
        if (h === question.correctH && m === question.correctM) handleCorrectQuest(); 
        else handleMistake();
      };
      const checkInteractive = () => {
        if (!question || questionCount > MAX_QUESTIONS) return;
        if ((interactiveMins % 720 + 720) % 720 === (question.targetTotal % 720 + 720) % 720) handleCorrectQuest(); 
        else handleMistake();
      };

      const useHint = () => { if (!showHint) { sounds.click(); setShowHint(true); setMessage('ヒント：まずは「じ」の みじかい はりを見よう。つぎに「ふん」の ながい はりを 5とびで数えよう。'); } };

      const startTimeAttack = (taType) => {
        sounds.click(); setView('time-attack'); setScore(0); setCombo(0);
        sessionRef.current = { name: taType === 'move' ? '⏳ まえ・あと アタック' : '⏰ よむ アタック', attempts: 0, misses: 0 };

        const initialTime = taType === 'move' ? 90 : 60; setTimeLeft(initialTime);
        const params = { type: taType, lv: 2, reward: 0 }; setModeParams(params); generateQuestion(params); 
        
        if (timerRef.current) clearInterval(timerRef.current);
        timerRef.current = setInterval(() => {
          setTimeLeft(t => {
            if (t <= 1) { clearInterval(timerRef.current); sounds.gachaSR(); return 0; }
            if (t <= 10) sounds.timeAttack(); 
            return t - 1;
          });
        }, 1000);
      };

      const handleTaAnswer = (h, m) => {
        if (!question) return;
        if (h === question.correctH && m === question.correctM) {
          sounds.correct(); setScore(s => s + 1);
          if (sessionRef.current) sessionRef.current.attempts += 1;
          generateQuestion(modeParams);
        } else {
          sounds.wrong();
          if (sessionRef.current) { sessionRef.current.misses += 1; sessionRef.current.attempts += 1; }
        }
      };

      const spinGacha = (times = 1) => {
        const cost = times === 10 ? 40 : 5;
        if (gears >= cost) {
          setGears(g => g - cost);
          let results = [];
          let newUnlocked = [...unlockedBadges];
          let hasSR = false;

          for (let i = 0; i < times; i++) {
            const r = Math.random(); let targetRarity = 'N';
            if (r > 0.62 && r <= 0.87) targetRarity = 'R';
            if (r > 0.87 && r <= 0.97) targetRarity = 'SR';
            if (r > 0.97) targetRarity = 'SECRET';
            let pool = ALL_BADGES.filter(s => s.rarity === targetRarity);
            let available = pool.filter(s => !newUnlocked.includes(s.id));
            if (available.length && (times === 10 || Math.random() < 0.55)) pool = available;
            const badge = pool[Math.floor(Math.random() * pool.length)];
            const isNew = !newUnlocked.includes(badge.id);
            if (isNew) newUnlocked.push(badge.id);
            results.push({ ...badge, isNew });
            if (targetRarity === 'SR' || targetRarity === 'SECRET') hasSR = true;
          }
          
          setUnlockedBadges(newUnlocked);
          if (hasSR) sounds.gachaSR(); else sounds.gachaN();
          setGachaResult(results);
        } else {
          sounds.wrong();
        }
      };

      const resetGame = () => {
        if(window.confirm("ほんとうに データを ぜんぶ けしますか？")) {
          localStorage.clear(); setGears(0); setUnlockedBadges([]); setPlayHistory([]); sounds.click();
        }
      };

      const getTaRewardInfo = () => {
        const baseMultiplier = modeParams.type === 'move' ? 6 : 3;
        const base = score * baseMultiplier; const bonus = score >= 5 ? 10 : 0;
        return { base, bonus, total: base + bonus };
      };

      const isInteractiveMode = modeParams && (modeParams.type === 'set' || (modeParams.type === 'move' && modeParams.lv === 1));

      const FreeModePanel = () => {
        const [tMins, setTMins] = useState(9 * 60);
        const [tQuest, setTQuest] = useState("");

        const tAnimate = (delta) => {
          const steps = 10; const stepAmt = delta / steps; let count = 0;
          const tick = () => { setTMins(p => p + stepAmt); count++; if (count < steps) requestAnimationFrame(tick); };
          requestAnimationFrame(tick);
        };

        const time = calcTime(tMins);
        const digitalTime = `${time.h12}:${String(time.m).padStart(2, '0')}`;

        return (
          <div className="teacher-panel">
            <div className="teacher-title">⏱️ 時計フリーモード</div>
            
            <Clock totalMinutes={tMins} interactive={true} onDrag={setTMins} showHint={true} step={1} />
            
            <div style={{
              fontSize: '48px', fontWeight: 'bold', color: '#2c3e50', 
              fontFamily: 'monospace', margin: '5px 0 20px 0', 
              textShadow: '2px 2px 0px rgba(255,255,255,0.8)'
            }}>
              {digitalTime}
            </div>

            <div className="teacher-controls">
              <button className="teacher-btn" onClick={() => { sounds.tick(); tAnimate(-60); }}>−1時間</button>
              <button className="teacher-btn" onClick={() => { sounds.tick(); tAnimate(60); }}>＋1時間</button>
              <button className="teacher-btn" onClick={() => { sounds.tick(); tAnimate(-1); }}>−1分</button>
              <button className="teacher-btn" onClick={() => { sounds.tick(); tAnimate(1); }}>＋1分</button>
            </div>

            <div style={{background: 'white', padding: '15px', borderRadius: '10px', marginBottom: '15px'}}>
              <input type="text" className="teacher-input" placeholder="問題を入力 (例: 10分あとは？)" 
                     value={tQuest} onChange={e => setTQuest(e.target.value)} style={{marginBottom: 0}} />
            </div>
            
            <button className="btn-back" style={{background: '#7f8c8d', boxShadow: '0 4px 0 #95a5a6', width: '100%', marginTop: 0}} onClick={() => { sounds.click(); setView('home'); }}>おわる</button>
          </div>
        );
      };

      return (
        <div className={`app-container ${bgMode}`}>
          {showSuccess && <div className="overlay"><div className="success-burst">
            {[...Array(16)].map((_, i) => <span key={i} className="confetti" style={{ '--r': `${i * 22.5}deg`, '--d': `${(i % 4) * 0.035}s`, '--c': ['#ff5f6d','#ffd447','#45c9a4','#4c9cff'][i % 4] }} />)}
            <div className="success-card"><div className="hanamaru">💮</div><div className="success-text">せいかい！</div><div className="success-sub">やったね！</div></div>
          </div></div>}
          
          {gachaResult && (
            <div className="overlay gacha-bg" style={{ overflowY: 'auto', padding: '20px' }}>
              <div className="gacha-title">
                {gachaResult.length === 1 
                  ? (gachaResult[0].isNew ? (gachaResult[0].rarity === 'SECRET' ? 'ひみつの大アタリ！！' : gachaResult[0].rarity === 'SR' ? '超・大アタリ！！' : gachaResult[0].rarity === 'R' ? '大アタリ！' : 'バッジゲット！') : 'かぶり！(もう持ってるよ)')
                  : '10連ガチャ 結果！'}
              </div>
              
              <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '10px', maxWidth: '600px' }}>
                {gachaResult.map((res, i) => (
                  <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <div className={`sticker gacha-item ${res.rarity}`} style={gachaResult.length > 1 ? { width: '80px', height: '80px' } : {}}>
                      <img src={res.image} alt={res.name} onError={e => { e.currentTarget.onerror = null; e.currentTarget.src = res.image.replace('/assets/web/', '/assets/'); }} />
                    </div>
                    <div style={{ color: 'white', fontWeight: 'bold', fontSize: '13px', textAlign: 'center', maxWidth: '110px' }}>{res.name}</div>
                    <div style={{ color: '#ffeaa7', fontWeight: 'bold', fontSize: '11px' }}>{res.rarityName}</div>
                    {res.isNew && <div style={{ color: '#ff4757', fontWeight: 'bold', fontSize: '12px', background: 'white', padding: '2px 5px', borderRadius: '5px', marginTop: '5px' }}>NEW</div>}
                  </div>
                ))}
              </div>

              <button className="btn-back" style={{marginTop: '30px', position:'relative', zIndex:10}} onClick={() => {sounds.click(); setGachaResult(null);}}>とじる</button>
            </div>
          )}

          {view !== 'record' && view !== 'freemode' && (
            <div className="status-bar">
              ⚙️ {gears}こ {combo > 1 && <span className="combo-text">🔥{combo}連勝!</span>}
            </div>
          )}
          
          {view === 'home' && (
            <div className="home-shell">
              <div className="home-intro">
                <img className="home-nav" src={naviImage(naviCharacter, 'waving')} alt="" aria-hidden="true" />
                <h1>じかんたんてい</h1>
                <p>とけいを よんで、じかんの なぞを とこう！</p>
              </div>
              <div className="menu-grid">
                <button className="menu-btn btn-easy" onClick={() => startGame('read', 0, 1)}>🐣 やさしい<br/><small>(⚙️1)</small></button>
                <button className="menu-btn btn-read1" onClick={() => startGame('read', 1, 2)}>🥉 よむ Lv1<br/><small>(3択/⚙️2)</small></button>
                <button className="menu-btn btn-set" onClick={() => startGame('set', 1, 2)}>⌚️ あわせる<br/><small>(時計/⚙️2)</small></button>
                <button className="menu-btn btn-read2" onClick={() => startGame('read', 2, 3)}>🥈 よむ Lv2<br/><small>(数字/⚙️3)</small></button>
                <button className="menu-btn btn-move1" onClick={() => startGame('move', 1, 4)}>🥇 まえ・あと Lv1<br/><small>(時計/⚙️4)</small></button>
                <button className="menu-btn btn-move2" onClick={() => startGame('move', 2, 5)}>🏆 まえ・あと Lv2<br/><small>(数字/⚙️5)</small></button>
                
                <button className="menu-btn btn-ta-read" onClick={() => startTimeAttack('read')}>
                  ⏰ よむ アタック (60びょう) <br/><small>1問せいかいで ⚙️3ゲット！</small>
                </button>
                <button className="menu-btn btn-ta-move" onClick={() => startTimeAttack('move')}>
                  ⏳ まえ・あと アタック (90びょう) <br/><small>1問せいかいで ⚙️6ゲット！！</small>
                </button>
                
                <button className="menu-btn btn-teacher" onClick={() => { sounds.click(); setView('freemode'); setMessage(''); }}>
                  ⏱️ 時計フリーモード <br/><small>自由に動かせるよ</small>
                </button>

                <button className="menu-btn btn-book" onClick={() => { sounds.click(); setView('notebook'); setMessage(''); }}>📖 バッジてちょう<br/>({unlockedBadges.length}/{ALL_BADGES.length})</button>
                <button className="menu-btn btn-record" onClick={() => { sounds.click(); setView('record'); setMessage(''); }}>🔍 たんていのきろく</button>
                
                <button className="menu-btn btn-reset" onClick={resetGame}>さいしょから (リセット)</button>
              </div>
            </div>
          )}

          {view === 'game' && question && (
            <div>
              <div className="status-bar" style={{marginBottom: '10px', background: '#ffeaa7', border: '2px solid #fdcb6e', color: '#d63031'}}>
                クエスト: {Math.min(questionCount, MAX_QUESTIONS)} / {MAX_QUESTIONS} もんめ
              </div>
              <div className="solve-layout">
                <div className="solve-clock">
                  <Clock 
                    totalMinutes={isInteractiveMode ? interactiveMins : question.displayMinutes} 
                    showHint={showHint} 
                    interactive={isInteractiveMode}
                    onDrag={setInteractiveMins} 
                    step={5} 
                  />
                </div>
                <div className="solve-panel">
                  {feedback && <div className="navi-feedback"><img src={naviImage(naviCharacter, feedback.startsWith('せいかい') ? 'correct' : 'retry')} alt="" aria-hidden="true" /><span>{feedback}</span></div>}
                  <div className="message-box">{message}</div>
                  {isInteractiveMode && questionCount <= MAX_QUESTIONS && (
                    <div className="controls">
                      <button className="control-btn" onClick={() => { sounds.tick(); setInteractiveMins(p=>p-60); }}>⏪ 1じかん</button>
                      <button className="control-btn" onClick={() => { sounds.tick(); setInteractiveMins(p=>p-5); }}>◁ 5ふん</button>
                      <button className="control-btn" onClick={() => { sounds.tick(); setInteractiveMins(p=>p+5); }}>5ふん ▷</button>
                      <button className="control-btn" onClick={() => { sounds.tick(); setInteractiveMins(p=>p+60); }}>1じかん ⏩</button>
                    </div>
                  )}

                  {showHint && modeParams && modeParams.type === 'read' && <div className="clock-guide"><span className="hour-word">① みじかい はり＝じ</span> を見る。<br/><span className="minute-word">② ながい はり＝ふん</span> を 5とびで数える。</div>}
                  {!showHint && questionCount <= MAX_QUESTIONS && <button className="btn-hint" onClick={useHint}>💡 ヒントをみる（何回でも無料）</button>}

                  {modeParams && modeParams.type === 'read' && modeParams.lv <= 1 && question.choices && questionCount <= MAX_QUESTIONS && (
                    <div className="choices">
                      {question.choices.map((c, i) => (
                        <button key={i} className="choice-btn" onClick={() => { sounds.click(); checkReadLv1(c.h, c.m); }}>{c.h}じ {c.m}ふん</button>
                      ))}
                    </div>
                  )}

                  {modeParams && modeParams.type === 'read' && modeParams.lv >= 2 && questionCount <= MAX_QUESTIONS && <Numpad key={question.id} onSubmit={(h, m) => { sounds.click(); checkNumpad(h, m); }} />}
                  {isInteractiveMode && questionCount <= MAX_QUESTIONS && <button className="choice-btn" onClick={() => { sounds.click(); checkInteractive(); }}>これだ！</button>}
                  {modeParams && modeParams.type === 'move' && modeParams.lv >= 2 && questionCount <= MAX_QUESTIONS && <Numpad key={question.id} onSubmit={(h, m) => { sounds.click(); checkNumpad(h, m); }} />}

                  <button className="btn-back" onClick={() => { sounds.click(); saveSessionAndGoHome(); }}>途中でやめる</button>
                </div>
              </div>
            </div>
          )}

          {view === 'time-attack' && question && (
            <div>
              <div className="status-bar" style={{marginBottom: '10px'}}>
                のこり {timeLeft}びょう　せいかい {score}もん
              </div>
              <div className="solve-layout">
                <div className="solve-clock"><Clock totalMinutes={question.displayMinutes} showHint={false} /></div>
                <div className="solve-panel">
                  <div className="message-box ta-question">{question.text}</div>
                  {timeLeft > 0 ? (
                    <Numpad key={question.id} onSubmit={handleTaAnswer} />
                  ) : (
                    <div>
                      <div className="message-box">おわり！ せいかい {score}もん<br/>{score >= 5 ? '🎉 5問以上ボーナス ＋10！ 🎉' : ''}</div>
                      <button
                        className={`menu-btn ${modeParams.type === 'move' ? 'btn-ta-move' : 'btn-ta-read'}`}
                        style={{ fontSize: '20px', padding: '15px' }}
                        onClick={() => { sounds.click(); const info = getTaRewardInfo(); setGears(g => g + info.total); saveSessionAndGoHome(); }}
                      >
                        ほうしゅうをもらう (⚙️{getTaRewardInfo().total})
                      </button>
                    </div>
                  )}
                  {timeLeft > 0 && <button className="btn-back" onClick={() => { sounds.click(); if (timerRef.current) clearInterval(timerRef.current); saveSessionAndGoHome(); }}>やめる</button>}
                </div>
              </div>
            </div>
          )}

          {view === 'notebook' && (
            <div>
              <h1>バッジてちょう</h1>
              <div style={{ display: 'flex', justifyContent: 'center', gap: '10px', maxWidth: '500px', margin: '0 auto 15px auto' }}>
                <button className="menu-btn btn-book" onClick={() => spinGacha(1)} disabled={gears < 5} style={{ padding: '15px', flex: 1 }}>
                  {gears >= 5 ? '🎲 1回 (⚙️5)' : '⚙️が たりない'}
                </button>
                <button className="menu-btn btn-book" onClick={() => spinGacha(10)} disabled={gears < 40} style={{ padding: '15px', flex: 1, background: '#e55039', color: 'white' }}>
                  {gears >= 40 ? '🎲 10連 (⚙️40)' : '⚙️が たりない'}
                </button>
              </div>

              <div className="notebook">
                <p style={{margin: '0 0 10px 0', fontWeight: 'bold'}}>あつめた数: {unlockedBadges.length} / {ALL_BADGES.length}</p>
                <p style={{margin: '0 0 10px 0', fontSize: '12px', color: '#765'}}>COMMON 65　RARE 20　SUPER RARE 10　SECRET 5</p>
                <div className="sticker-grid">
                  {ALL_BADGES.map((s) => {
                    const unlocked = unlockedBadges.includes(s.id);
                    return <div key={s.id} className="sticker-card">
                      <div className={`sticker ${unlocked ? s.rarity : 'locked-sticker'}`}>{unlocked ? <img src={s.image} alt={s.name} onError={e => { e.currentTarget.onerror = null; e.currentTarget.src = s.image.replace('/assets/web/', '/assets/').replace('.webp', '.png'); }} /> : "？"}</div>
                      <div className="badge-name">{unlocked ? s.name : '？？？'}</div>
                      <div className="rarity-label">{s.rarityName}</div>
                    </div>;
                  })}
                </div>
              </div>
              <button className="btn-back" onClick={() => { sounds.click(); setView('home'); }}>もどる</button>
            </div>
          )}

          {view === 'record' && (
            <DetectiveRecord 
              totalGears={gears} 
              questData={playHistory} 
              onBack={() => { sounds.click(); setView('home'); }} 
            />
          )}

          {view === 'freemode' && <FreeModePanel />}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
