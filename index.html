<style>
:root{--ink:#243044;--paper:#fffdf7;--red:#e95362;--red-soft:#fff0f1;--blue:#2477c9;--blue-soft:#eaf5ff;--green:#24966c;--orange:#e87d2b;--purple:#7650c8;--shadow:0 5px 0 rgba(32,55,79,.17)}*{box-sizing:border-box}body{margin:0;background:#e9f6ff;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;touch-action:manipulation}.app{min-height:100vh;padding:12px 14px 28px;text-align:center;background:linear-gradient(180deg,#75c9f4,#f9e7b8 92%)}button{font:inherit;font-weight:800;cursor:pointer;border:0;min-height:48px;touch-action:manipulation}button:disabled{opacity:.48;cursor:default}.top{max-width:760px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center}.brand{margin:5px 0;font-size:clamp(23px,4vw,34px);line-height:1.12;color:white;text-shadow:0 3px 0 #3b83a7}.small-status{display:inline-flex;gap:10px;align-items:center;background:#ffffffdc;padding:7px 12px;border-radius:999px;font-size:14px;box-shadow:0 3px 0 #a7d5e9}.sound{border-radius:999px;background:#fff;padding:7px 10px;min-height:38px;box-shadow:0 3px 0 #b8d5e3}.panel{max-width:760px;margin:auto;background:var(--paper);border-radius:22px;padding:15px;box-shadow:var(--shadow)}.hero{max-width:560px;margin:0 auto 18px;border-radius:22px;color:white;padding:19px;background:linear-gradient(135deg,#ffad39,#ec6b56);box-shadow:0 6px 0 #c55447}.hero strong{display:block;font-size:25px}.hero small{font-size:16px}.section-title{text-align:left;max-width:700px;margin:17px auto 8px;font-size:17px}.cards{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border-radius:18px;color:#fff;padding:14px 8px;box-shadow:0 5px 0 rgba(0,0,0,.16);font-size:17px}.card small{display:block;font-size:12px;margin-top:4px}.read{background:var(--blue)}.set{background:var(--green)}.move{background:var(--orange)}.challenge{background:var(--purple)}.items{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:450px;margin:auto}.item{background:#fff3b9;border-radius:14px;padding:12px;color:#5b4931;box-shadow:0 4px 0 #e7ce71}.teacher{margin-top:20px;background:transparent;color:#526270;font-size:13px;text-decoration:underline;min-height:34px}.mode-head{display:flex;max-width:700px;margin:0 auto 8px;justify-content:space-between;align-items:center}.back{background:#fff;border-radius:12px;padding:8px 12px;min-height:38px;box-shadow:0 3px 0 #c9d5dd}.progress{font-size:15px;font-weight:800}.question{font-size:clamp(21px,3vw,29px);font-weight:900;line-height:1.5;min-height:58px;padding:7px}.hour{color:var(--red)}.minute{color:var(--blue)}.clock-wrap{width:min(300px,78vw);aspect-ratio:1;margin:5px auto 10px;filter:drop-shadow(0 8px 6px #6f7d8247)}svg.clock{width:100%;height:100%;overflow:visible;touch-action:none}.clock .face{fill:#fffdf8;stroke:#f1b750;stroke-width:3}.clock .tick{stroke:#9fa6a8;stroke-width:1}.clock .major{stroke:#59626d;stroke-width:1.7}.clock .num{font-size:9px;font-weight:900;fill:#354052}.clock .minhint{font-size:5.2px;fill:var(--blue);font-weight:900}.hourhand{stroke:var(--red);stroke-width:6;stroke-linecap:round}.minhand{stroke:var(--blue);stroke-width:4;stroke-linecap:round}.pin{fill:#ffc84f;stroke:#7b6040;stroke-width:1.2}.clock.sparkle{animation:shine .45s ease-in-out 2}@keyframes shine{50%{filter:brightness(1.22);transform:scale(1.035)}}.hintbox,.feedback,.explain{max-width:540px;margin:8px auto;border-radius:14px;padding:10px 13px;font-weight:800;line-height:1.55}.hintbox{background:#fff4bd;border:2px solid #edc953}.feedback{background:#eafff2;border:2px solid #80cfa5}.feedback.ouch{background:#fff1ef;border-color:#e7a39d}.explain{background:#eaf6ff;border:2px solid #8bc7ed;text-align:left}.hintbtn{background:#fff3b5;border:2px solid #edc953;border-radius:14px;padding:8px 16px;box-shadow:0 3px 0 #d8b33f}.controls,.choices{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px auto}.control{border-radius:12px;padding:8px 11px;background:#eef5fa;color:#31526d;box-shadow:0 3px 0 #b9cedd;min-height:42px}.submit{border-radius:14px;padding:11px 25px;color:#fff;background:var(--green);box-shadow:0 4px 0 #167452;font-size:19px}.choice{border:3px solid var(--blue);border-radius:14px;background:white;padding:10px 14px;color:#1d4f83;font-size:19px;box-shadow:0 4px 0 #a7cae8}.numpad{max-width:300px;margin:8px auto;background:#f2f8fc;padding:11px;border-radius:16px}.display{font-size:25px;margin-bottom:7px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.key{background:white;border-radius:10px;box-shadow:0 3px 0 #bdd1df;font-size:21px}.key.action{background:#cce9fb}.key.ok{grid-column:span 3;background:var(--green);color:#fff}.result h2{margin:4px}.result-score{font-size:24px}.next{margin:10px;border-radius:14px;background:#ffb23f;color:white;padding:11px 17px;box-shadow:0 4px 0 #d78322}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}.hanamaru{font-size:clamp(115px,25vw,180px);animation:pop .65s ease-out forwards}@keyframes pop{0%{transform:scale(3) rotate(-25deg);opacity:0}65%{transform:scale(.9)}100%{transform:scale(1);opacity:1}}.levels{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:8px}.level{border-radius:999px;padding:8px 12px;min-height:38px;background:#edf2f5;color:#43515e}.level.active{background:var(--blue);color:#fff}.list{max-width:580px;margin:12px auto;text-align:left}.list-row{background:#fff;border-radius:13px;padding:11px;margin:7px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 0 #eadfb6}.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}.sticker{font-size:30px;background:#fff;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;border:3px solid #d8d8d8}.sticker.R{border-color:#b8c2ce;background:#f0f7ff}.sticker.SR,.sticker.badge{border-color:#f2bc31;background:#fff4bb}.locked{opacity:.25}.gacha{background:#f5c64c;color:#4d3b19;border-radius:14px;padding:10px;box-shadow:0 4px 0 #d99d23}.free-controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:500px;margin:auto}.free-controls button{border-radius:12px;background:#ffe5b3;color:#71440c;box-shadow:0 3px 0 #e9b25a}.hidden{display:none}@media(min-width:720px){.app{padding-top:18px}.panel.game{padding:14px 30px}.free-controls{grid-template-columns:repeat(4,1fr)}}@media(max-width:430px){.cards{gap:6px}.card{font-size:14px;padding:11px 4px}.small-status{font-size:12px}.top{align-items:flex-start}.question{font-size:20px}}
</style></head><body><main id="app" class="app"></main><script>
(() => { 'use strict';
const KEY='tokeiTownProgressV2', MAX=5, STICKERS=['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐯','🦁','🐸','🐵','🐧','🐦','🦄','🐝','🦋','🐢','🐙','🐬','🦈','🍎','🍓','🍕','🍙','🚗','🚌','🚀','💎','🏆','🐉'];
const STEPS=[{id:1,name:'○時',type:'read',unit:60},{id:2,name:'○時半',type:'read',unit:30},{id:3,name:'5分きざみ',type:'read',unit:5},{id:4,name:'1分きざみ',type:'read',unit:1},{id:5,name:'○分あと',type:'move',dir:1},{id:6,name:'○分まえ',type:'move',dir:-1},{id:7,name:'時をまたぐ',type:'move',cross:true},{id:8,name:'せいかつのじかん',type:'read',unit:5}];
const app=document.querySelector('#app'); let state=load(), view='home', game=null, freeTime=540, locked=false, audio=null;
function base(){return {gears:0,stickers:[],badges:[],sound:true,steps:{},history:[],last:null};}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)return {...base(),...x};const oldG=Number(localStorage.getItem('tokei_gears')||localStorage.getItem('gears')||0), oldS=JSON.parse(localStorage.getItem('unlockedStickers')||'[]');return {...base(),gears:oldG,stickers:oldS, migrated:true};}catch{return base()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))} function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function tone(f,d=.08,t='sine',at=0,v=.07){if(!state.sound)return;try{audio??=new (window.AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime+at);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+at+d);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+at);o.stop(audio.currentTime+at+d)}catch{}}
const snd={click:()=>tone(720,.05),tick:()=>tone(980,.025,'square',0,.035),ok:()=>[523,659,784].forEach((x,i)=>tone(x,.12,'sine',i*.09)),soft:()=>tone(250,.09,'sine'),clear:()=>[523,659,784,1046].forEach((x,i)=>tone(x,.12,'sine',i*.07)),seal:()=>[659,784,988].forEach((x,i)=>tone(x,.14,'square',i*.08))};
function time(t){t=((Math.round(t)%1440)+1440)%1440;const m=t%60,h=Math.floor(t/60)%12||12;return{h,m,t}} function digits(n){return String(n).padStart(2,'0')} function textTime(t){let x=time(t);return `<span class="hour">${x.h}じ</span><span class="minute">${x.m}ふん</span>`} function r(n){return Math.floor(Math.random()*n)}
function recommendation(){for(const s of STEPS){let d=state.steps[s.id];if(!d||d.correct<5||d.rate<.72)return s}return STEPS[7]}
function rank(){let n=Object.values(state.steps).reduce((a,x)=>a+(x.correct||0),0);return n<8?'みならいたんてい':n<25?'かけだしたんてい':n<55?'りっぱなたんてい':'とけいマスター'}
function render(){let content=view==='home'?home():view==='practice'?practice():view==='game'?gameScreen():view==='result'?result():view==='items'?items():view==='record'?record():view==='teacher'?teacher():view==='challenge'?challenge():'';app.innerHTML=content;bind()}
function header(back=''){return `<div class="top"><button class="sound" data-action="sound">🔊 ${state.sound?'ON':'OFF'}</button><div class="small-status">${rank()}　⭐ ${state.gears}<br><small>つぎのランクまで あと${Math.max(0,8-Object.values(state.steps).reduce((a,x)=>a+(x.correct||0),0))}</small></div>${back?`<button class="back" data-view="${back}">もどる</button>`:''}</div>`}
function home(){let next=recommendation(), started=Object.keys(state.steps).length;return `${header()}<h1 class="brand">⏰ とけいのまち<br>じかんたんてい</h1><button class="hero" data-start="${next.id}"><strong>⭐ おすすめコース</strong><small>${started?'▶ つづきから':'ここから はじめよう！'}<br>${esc(next.name)}を やってみよう</small></button><h2 class="section-title">🔍 れんしゅう</h2><div class="cards"><button class="card read" data-practice="read">⏰ よむ<small>時計を見て 時刻を答える</small></button><button class="card set" data-practice="set">🕰️ あわせる<small>針を動かして あわせる</small></button><button class="card move" data-practice="move">⏳ まえ・あと<small>○分前・○分後を考える</small></button></div><h2 class="section-title">⚡ チャレンジ</h2><button class="card challenge" data-view="challenge" style="max-width:700px;width:100%">スピードチャレンジ<small>できるようになったら 挑戦！</small></button><h2 class="section-title">🎒 たんていアイテム</h2><div class="items"><button class="item" data-view="items">📖 シールちょう<br><small>${state.stickers.length}/${STICKERS.length}まい</small></button><button class="item" data-view="record">🔍 たんていのきろく</button></div><button class="teacher" data-view="teacher">⚙️ 先生・おうちの人（時計フリーモード）</button>`}
function practice(){let type=game?.practice||'read', steps=STEPS.filter(s=>type==='set'?s.id<=4:type==='move'?s.type==='move':s.type==='read');return `${header('home')}<div class="panel"><h2>${type==='read'?'⏰ よむ':type==='set'?'🕰️ あわせる':'⏳ まえ・あと'}</h2><p>すきな ステップを えらぼう</p><div class="list">${steps.map(s=>{let d=state.steps[s.id]||{}, stars=d.correct>=5?'★★★':d.correct>=2?'★★':'★';return `<button class="list-row" data-start="${s.id}" data-kind="${type}"><span>STEP ${s.id}　${s.name}</span><span>${stars}</span></button>`}).join('')}</div></div>`}
function makeQuestion(step,kind){let h=r(12)+1,m=0,unit=step.unit||5;if(step.id===1)m=0;else if(step.id===2)m=30;else if(step.id===3||step.id===8)m=r(12)*5;else if(step.id===4)m=r(60);let start=h*60+m, offset=0;if(kind==='set'){let target=(r(12)+1)*60+(step.id<3?(step.id===1?0:30):step.id===3?r(12)*5:r(60));let shown=(r(12)+1)*60+(r(12)*5);return {step,kind,start:shown,target,answer:target}}if(step.type==='move'||kind==='move'){offset=(step.cross?[10,15,20,25,30][r(5)]:[5,10,15,20,25,30][r(6)])*(step.dir||1);if(step.cross){start=(step.dir===-1?4:3)*60+(step.dir===-1?10:50)}else start=(r(12)+1)*60+r(9)*5;return {step,kind:'move',start,offset,target:start+offset,answer:start+offset}}return{step,kind:'read',start,answer:start}}
function start(stepId,kind){let step=STEPS.find(s=>s.id===+stepId)||STEPS[0];game={step,kind:kind==='set'?'set':kind==='move'?'move':step.type==='move'?'move':'read',qNo:1,correct:0,tries:0,hints:0,input:'',cursor:'h',working:0,answers:0,miss:0,flash:false};nextQuestion();view='game';snd.click();render()}
function nextQuestion(){game.q=makeQuestion(game.step,game.kind);game.working=game.q.kind==='set'?game.q.start:game.q.kind==='move'&&game.step.id===5?game.q.start:0;game.tries=0;game.hints=0;game.feedback='';game.explain=false;game.input='';game.cursor='h';locked=false}
function coloredQuestion(q){if(q.kind==='read')return 'この 時計は　なんじ なんぷん？';if(q.kind==='set')return `時計を 「${textTime(q.target)}」に あわせよう！`;let w=q.offset>0?`${q.offset}ぷん あと`:`${Math.abs(q.offset)}ぷん まえ`;return `いま ${textTime(q.start)}。 「${w}」は なんじ？`}
function clock(t,interactive=false,hints=0,cls=''){let x=time(t), ha=(x.h%12)*30+x.m*.5,ma=x.m*6;let marks=[...Array(60)].map((_,i)=>{let a=(i*6-90)*Math.PI/180,outer=50+44*Math.cos(a),oy=50+44*Math.sin(a),inner=50+(i%5?40:37)*Math.cos(a),iy=50+(i%5?40:37)*Math.sin(a);return `<line class="tick ${i%5===0?'major':''}" x1="${inner}" y1="${iy}" x2="${outer}" y2="${oy}"/>`}).join('');let nums=[...Array(12)].map((_,i)=>{let n=i+1,a=(n*30-90)*Math.PI/180;return `<text class="num" x="${50+31*Math.cos(a)}" y="${50+31*Math.sin(a)}" text-anchor="middle" dominant-baseline="central">${n}</text>`}).join('');let min=hints>1?[...Array(12)].map((_,i)=>{let n=i===0?60:i*5,a=(i*30-90)*Math.PI/180;return `<text class="minhint" x="${50+21*Math.cos(a)}" y="${50+21*Math.sin(a)}" text-anchor="middle" dominant-baseline="central">${n}</text>`}).join(''):'';return `<div class="clock-wrap"><svg class="clock ${cls}" data-clock="${interactive?'yes':''}" viewBox="0 0 100 100"><circle class="face" cx="50" cy="50" r="47"/>${marks}${nums}${min}<line class="hourhand" x1="50" y1="50" x2="${50+21*Math.cos((ha-90)*Math.PI/180)}" y2="${50+21*Math.sin((ha-90)*Math.PI/180)}"/><line class="minhand" x1="50" y1="50" x2="${50+34*Math.cos((ma-90)*Math.PI/180)}" y2="${50+34*Math.sin((ma-90)*Math.PI/180)}"/><circle class="pin" cx="50" cy="50" r="3.5"/></svg></div>`}
function hint(q){if(!game.hints)return '';let x=time(q.answer), first=`<span class="hour">じ（みじかい はり）</span>を 見よう。`;if(game.hints===1)return `<div class="hintbox">💡 ${first}</div>`;if(game.hints===2)return `<div class="hintbox">💡 ${first}<br><span class="minute">ふん（ながい はり）</span>は、5とびで 数えよう。</div>`;let h=x.m===0?x.h:(x.h===12?12:x.h), pos=x.m/5;return `<div class="hintbox">💡 みじかい はりは ${h}じの あたり。だから <span class="hour">${x.h}じ</span>。<br>ながい はりは ${pos||12}の ところ。${x.m?` ${pos||12}×5＝<span class="minute">${x.m}ぷん</span>。`:''}<br>答えは ${textTime(q.answer)}！</div>`}
function explanation(q){let x=time(q.answer), near=x.m>=45?` ${x.h===12?1:x.h+1}じに 近いけれど、まだ ${x.h}じだよ。`:'';if(q.kind==='move'){let dir=q.offset>0?'あと':'まえ',steps=Math.abs(q.offset)/5;return `<div class="explain">🔎 いっしょに たしかめよう！<br>${textTime(q.start)}から ${Math.abs(q.offset)}ぷん${dir}は、5ぷんずつ ${steps}回 動くよ。<br>長い針が12をこえると、短い針がひとつ進むよ。答えは ${textTime(q.answer)}。</div>`}return `<div class="explain">🔎 いっしょに たしかめよう！<br>① <span class="hour">短い針（じ）</span>を見る。${near}<br>② <span class="minute">長い針（ふん）</span>を見る。<br>③ ${textTime(q.answer)}！</div>`}
function gameScreen(){let q=game.q, interactive=q.kind==='set'||(q.kind==='move'&&game.step.id===5), isChoice=q.kind==='read'&&game.step.id<=3;let choices=isChoice?choiceTimes(q.answer,game.step.id):[];return `${header('home')}<div class="panel game"><div class="mode-head"><span class="progress">STEP ${game.step.id}　${game.qNo}/${MAX}もん</span><span>⭐ ${state.gears}</span></div><div class="question">${coloredQuestion(q)}</div>${clock(interactive?game.working:q.start,interactive,game.hints,game.flash?'sparkle':'')}${interactive?`<div class="controls"><button class="control" data-adjust="-60">−1じかん</button><button class="control" data-adjust="-5">−5ふん</button><button class="control" data-adjust="5">＋5ふん</button><button class="control" data-adjust="60">＋1じかん</button></div>`:''}${game.feedback?`<div class="feedback ${game.feedback.includes('おしい')?'ouch':''}">${game.feedback}</div>`:''}${hint(q)}${game.explain?explanation(q):''}${!game.explain?`<button class="hintbtn" data-action="hint">💡 ヒントをみる（何回でも無料）</button>`:''}${game.explain?'<button class="next" data-action="retry">もういちど やってみよう！</button>':isChoice?`<div class="choices">${choices.map(t=>`<button class="choice" data-answer="${t}">${textTime(t)}</button>`).join('')}</div>`:interactive?'<button class="submit" data-action="check">これだ！</button>':numpad()}<button class="teacher" data-view="home">ホームへ もどる</button></div>`}
function choiceTimes(a,step){let unit=step===1?60:step===2?30:5,arr=[a,a+unit,a-unit,a+60];return [...new Set(arr.map(x=>((x%720)+720)%720))].sort(()=>Math.random()-.5)}
function numpad(){let d=[1,2,3,4,5,6,7,8,9,'けす',0];return `<div class="numpad"><div class="display">${game.input||'？:？？'}</div><div class="keys">${d.map(x=>`<button class="key ${x==='けす'?'action':''}" data-key="${x}">${x}</button>`).join('')}<button class="key ok" data-key="OK">これで答える</button></div></div>`}
function check(ans){if(locked||game.explain)return;locked=true;game.answers++;let correct=((ans%720)+720)%720===((game.q.answer%720)+720)%720;if(game.attack){if(correct){game.attackScore++;snd.ok();setTimeout(attackQuestion,260)}else{snd.soft();locked=false;game.feedback='おしい！';render()}return}if(correct){game.correct++;game.flash=true;snd.ok();award(1);setTimeout(()=>{if(game.qNo>=MAX)finish();else{game.qNo++;nextQuestion();render()}},700)}else{game.miss++;game.tries++;snd.soft();if(game.tries===1)game.feedback='おしい！ もういちど！';else if(game.tries===2){game.hints=Math.max(game.hints,2);game.feedback='ヒントを 見てみよう！';}else{game.hints=3;game.explain=true;game.feedback='いっしょに たしかめよう！'}locked=false;render()}}
function award(n){state.gears+=n;save()} function finish(){let d=state.steps[game.step.id]||{correct:0,total:0,miss:0};d.correct+=game.correct;d.total+=game.answers;d.miss+=game.miss;d.rate=d.total?d.correct/d.total:0;state.steps[game.step.id]=d;state.history.unshift({id:game.step.id,name:game.step.name,correct:game.correct,total:game.answers,at:Date.now()});state.history=state.history.slice(0,18);let before=[...state.badges];if(game.correct>=5)addBadge('🏅 はじめてのせいかい');if(game.step.id===3&&d.correct>=5)addBadge('⏰ 5ふんマスター');if(game.step.id===4&&d.correct>=5)addBadge('🕰️ 1ぷんマスター');if((game.step.id===5||game.step.id===6)&&d.correct>=5)addBadge('⏳ まえ・あとマスター');if(game.correct>=5)addBadge('🔥 5もんれんぞく');if(Object.values(state.steps).every(x=>x.correct>=5)&&Object.keys(state.steps).length>=8)addBadge('👑 とけいマスター');if(before.length!==state.badges.length){state.gears+=3;snd.seal()}if(game.correct>=4){state.gears+=2;snd.clear()}save();view='result';render()}
function addBadge(b){if(!state.badges.includes(b))state.badges.push(b)}
function result(){let clear=game.correct>=4,next=STEPS.find(s=>s.id===game.step.id+1);return `${header('home')}<div class="panel result"><h2>${clear?'🎉 STEP クリア！':'5もん おつかれさま！'}</h2><p class="result-score"><b>${game.correct}もん せいかい！</b> / ${MAX}もん</p><p>${clear?'よく がんばったね！':'ヒントを使って、できることを ふやそう！'}</p>${next&&clear?`<button class="next" data-start="${next.id}">つぎは「${next.name}」へ ▶</button>`:''}<div><button class="choice" data-retry="1">もう1かい</button><button class="back" data-view="home">ホームへ</button></div></div>`}
function items(){return `${header('home')}<div class="panel"><h2>📖 シールちょう</h2><p>ガチャと がんばった あかしで あつめよう！</p><button class="gacha" data-action="gacha">🎲 ガチャをまわす（⭐ 10こ）</button><h3>実績シール</h3><div class="stickers">${['🏅 はじめてのせいかい','⏰ 5ふんマスター','🕰️ 1ぷんマスター','⏳ まえ・あとマスター','🔥 5もんれんぞく','🌟 10もんれんぞく','👑 とけいマスター'].map(x=>`<div class="sticker badge ${state.badges.includes(x)?'':'locked'}" title="${x}">${x.split(' ')[0]}</div>`).join('')}</div><h3>ガチャシール　${state.stickers.length}/${STICKERS.length}</h3><div class="stickers">${STICKERS.map((x,i)=>`<div class="sticker ${state.stickers.includes(i)?(i>25?'SR':i>18?'R':''): 'locked'}">${state.stickers.includes(i)?x:'？'}</div>`).join('')}</div></div>`}
function record(){let rows=STEPS.map(s=>{let d=state.steps[s.id]||{},rate=d.total?Math.round(d.correct/d.total*100):0,status=!d.total?'まだこれから':rate>=80?'とくい ★★★':rate>=55?'れんしゅう中 ★★':'おすすめ ★';return `<div class="list-row"><span>${s.name}<br><small>${d.total?`${d.correct}/${d.total}もん（${rate}%）`:'プレイしてみよう'}</small></span><span>${status}</span></div>`}).join('');let weak=STEPS.map(s=>({s,d:state.steps[s.id]||{}})).filter(x=>x.d.total).sort((a,b)=>(a.d.rate||0)-(b.d.rate||0))[0];return `${header('home')}<div class="panel"><h2>🔍 たんていのきろく</h2><p>⭐ ${state.gears}　シール ${state.stickers.length}まい</p>${weak?`<div class="hintbox">🎯 おすすめ：「${weak.s.name}」を やってみよう！</div>`:''}<div class="list">${rows}</div></div>`}
function teacher(){return `${header('home')}<div class="panel"><h2>⚙️ 時計フリーモード</h2><p>時計を じゆうに 動かせます</p>${clock(freeTime,true,2)}<p style="font-size:30px;font-weight:900">${textTime(freeTime)}</p><div class="free-controls">${[-60,-30,-10,-5,-1,1,5,10,30,60].map(n=>`<button data-free="${n}">${n>0?'＋':'−'}${Math.abs(n)===60?'1じかん':Math.abs(n)+'ふん'}</button>`).join('')}</div><input id="free-note" style="margin-top:15px;width:min(440px,100%);padding:12px;border:2px solid #e7c56e;border-radius:10px;font:inherit" placeholder="問題を入力（例：10分あとは？）"></div>`}
function challenge(){return `${header('home')}<div class="panel"><h2>⚡ スピードチャレンジ</h2><p>60びょうで 何もんできるかな？<br><small>時計が よめるようになったら 挑戦しよう！</small></p><button class="next" data-action="attack">はじめる！</button></div>`}
function bind(){app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start,b.dataset.kind));app.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{game={practice:b.dataset.practice};view='practice';render()});let s=app.querySelector('[data-action="sound"]');if(s)s.onclick=()=>{state.sound=!state.sound;save();render()};app.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>{game.working+=+b.dataset.adjust;snd.tick();render()});app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>check(+b.dataset.answer));let h=app.querySelector('[data-action="hint"]');if(h)h.onclick=()=>{game.hints=Math.min(3,game.hints+1);snd.click();render()};let c=app.querySelector('[data-action="check"]');if(c)c.onclick=()=>check(game.working);let re=app.querySelector('[data-action="retry"]');if(re)re.onclick=()=>{game.explain=false;game.feedback='できるまで いっしょに！';game.tries=0;render()};app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));app.querySelectorAll('[data-retry]').forEach(b=>start(game.step.id,game.kind));app.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>{animateFree(+b.dataset.free)});let g=app.querySelector('[data-action="gacha"]');if(g)g.onclick=gacha;let a=app.querySelector('[data-action="attack"]');if(a)a.onclick=attack;app.querySelectorAll('svg[data-clock="yes"]').forEach(el=>{let moving=false;let move=e=>{if(!moving)return;e.preventDefault();let rct=el.getBoundingClientRect(),p=e.touches?e.touches[0]:e,ang=(Math.atan2(p.clientY-(rct.top+rct.height/2),p.clientX-(rct.left+rct.width/2))*180/Math.PI+450)%360,min=Math.round(ang/6);if(view==='teacher')freeTime=Math.round(freeTime/60)*60+min;else game.working=Math.floor(game.working/60)*60+min;snd.tick();render()};el.onpointerdown=e=>{moving=true;el.setPointerCapture?.(e.pointerId);move(e)};el.onpointermove=move;el.onpointerup=()=>moving=false})}
function key(k){if(k==='けす')game.input=game.input.slice(0,-1);else if(k==='OK'){let m=game.input.match(/^(\d{1,2}):(\d{1,2})$/);if(m){let h=+m[1];if(h===0)h=12;if(h>=1&&h<=12&&+m[2]<=59)check(h*60+(+m[2]));else{game.feedback='じは 1〜12、ふんは 0〜59だよ。';render()}return}game.feedback='「3:25」のように 入れてね。'}else{let v=String(k);if(!game.input)game.input=v;else if(!game.input.includes(':')&&game.input.length<2)game.input+=v;else if(!game.input.includes(':'))game.input+=':';else if(game.input.split(':')[1].length<2)game.input+=v}render()}
function animateFree(delta){let from=freeTime,n=8,i=0;function go(){i++;freeTime=from+delta*i/n;render();if(i<n)requestAnimationFrame(go)}go()}
function gacha(){if(state.gears<10){alert('⭐が 10こ たまったら まわせるよ！');return}state.gears-=10;let available=STICKERS.map((_,i)=>i).filter(i=>!state.stickers.includes(i)),id=available.length?available[r(available.length)]:r(STICKERS.length);if(!state.stickers.includes(id))state.stickers.push(id);save();snd.seal();alert(`シールゲット！ ${STICKERS[id]}`);render()}
function attack(){game={attack:true,attackEnd:Date.now()+60000,attackScore:0,input:'',feedback:'',q:null};attackQuestion()}function attackQuestion(){if(Date.now()>=game.attackEnd){let earned=game.attackScore*2;state.gears+=earned;save();alert(`${game.attackScore}もん せいかい！ ⭐${earned}こゲット！`);view='home';render();return}let q=makeQuestion(STEPS[2],'read');game.q={answer:q.answer};game.input='';app.innerHTML=`${header('home')}<div class="panel"><h2>のこり ${Math.ceil((game.attackEnd-Date.now())/1000)}びょう　${game.attackScore}もんせいかい</h2><div class="question">この 時計は なんじ なんぷん？</div>${clock(q.start,false,0)}${numpad()}</div>`;bind();setTimeout(()=>{if(game&&game.attack&&Date.now()>=game.attackEnd)attackQuestion()},300)}
render();
})();
</script></body></html>
